

test_cases:

  - name: "Pick up red cube (MTC Pick and Place)"
    prompt: "pick up the red_cube and place it on the delivery_tray"
    available_objects: ["red_cube", "delivery_tray"]
    expected:
      recipe_name: "Pick and Place Red Cube"
      must_contain_actions: ["pick_and_place"]
      must_contain_targets: ["red_cube", "delivery_tray"]

  - name: "Wave goodbye"
    prompt: "wave goodbye"
    available_objects: []
    expected:
      must_contain_actions: ["relative_move"]